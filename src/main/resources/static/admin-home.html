<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="app-nav">
    <div class="app-nav-inner">
      <a class="brand" href="/admin-home.html">
        <span class="brand-mark">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="28" height="28" rx="8" fill="#2563EB"/>
            <path d="M9 11.5V9.8a5 5 0 0 1 10 0v1.7" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
            <rect x="6.5" y="11.5" width="15" height="10" rx="2.6" fill="#FFFFFF"/>
            <circle cx="11.5" cy="16.5" r="1.15" fill="#2563EB"/>
            <circle cx="16.5" cy="16.5" r="1.15" fill="#2563EB"/>
          </svg>
        </span>
        <span class="brand-name">CartNest<span class="brand-badge role-admin">Admin</span></span>
      </a>
      <nav class="app-nav-links">
        <a href="/admin-home.html" class="active">Dashboard</a>
        <a href="/all-products-admin.html">Products</a>
      </nav>
      <div class="app-nav-user">
        <span class="user-chip" id="welcomeText"></span>
        <button class="btn-ghost-on-dark" onclick="logout()">Log out</button>
      </div>
    </div>
  </header>

  <div class="page">
    <div class="page-header">
      <div>
        <h1>Dashboard</h1>
        <p class="subtitle">Manage the CartNest product catalog from here.</p>
      </div>
    </div>

    <div class="action-grid">
      <a class="action-card" href="/add-product.html">
        <div class="action-card-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M9 3v12M3 9h12" stroke="#0F172A" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <h3>Add a product</h3>
        <p>Create a new catalog listing with pricing, stock, and category.</p>
      </a>

      <a class="action-card" href="/all-products-admin.html">
        <div class="action-card-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="2.5" y="3.5" width="13" height="3" rx="1" stroke="#0F172A" stroke-width="1.4"/>
            <rect x="2.5" y="8" width="13" height="3" rx="1" stroke="#0F172A" stroke-width="1.4"/>
            <rect x="2.5" y="12.5" width="13" height="2.5" rx="1" stroke="#0F172A" stroke-width="1.4"/>
          </svg>
        </div>
        <h3>View all products</h3>
        <p>Browse, edit, and remove existing products in the catalog.</p>
      </a>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
