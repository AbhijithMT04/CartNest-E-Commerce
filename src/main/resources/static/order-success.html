<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed — CartNest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
      .success-wrapper {
        max-width: 680px;
        margin: 40px auto;
        padding: 0 16px;
      }
      .success-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        border: 1px solid #e2e8f0;
        text-align: center;
      }
      .success-icon {
        width: 64px;
        height: 64px;
        background: #dcfce7;
        color: #16a34a;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
      }
      .success-icon svg {
        width: 36px;
        height: 36px;
      }
      .order-meta-box {
        background: #f8fafc;
        border: 1px dashed #cbd5e1;
        border-radius: 12px;
        padding: 16px 20px;
        margin: 24px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-align: left;
      }
      .order-meta-item span {
        display: block;
        font-size: 0.85rem;
        color: #64748b;
      }
      .order-meta-item strong {
        font-size: 1rem;
        color: #0f172a;
      }
      .timeline {
        display: flex;
        justify-content: space-between;
        margin: 32px 0 24px;
        position: relative;
      }
      .timeline::before {
        content: '';
        position: absolute;
        top: 14px;
        left: 10%;
        right: 10%;
        height: 3px;
        background: #e2e8f0;
        z-index: 1;
      }
      .timeline-step {
        position: relative;
        z-index: 2;
        background: #ffffff;
        padding: 0 8px;
      }
      .timeline-dot {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #e2e8f0;
        color: #64748b;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
        margin: 0 auto 8px;
      }
      .timeline-step.active .timeline-dot {
        background: #2563eb;
        color: #ffffff;
      }
      .timeline-step.completed .timeline-dot {
        background: #16a34a;
        color: #ffffff;
      }
      .timeline-label {
        font-size: 0.8rem;
        color: #64748b;
        font-weight: 500;
      }
      .timeline-step.active .timeline-label {
        color: #0f172a;
        font-weight: 700;
      }
      .action-buttons {
        display: flex;
        gap: 12px;
        margin-top: 28px;
      }
      .action-buttons button {
        flex: 1;
      }
    </style>
</head>
<body>
    <header class="app-nav">
      <div class="app-nav-inner">
        <a class="brand" href="/customer-home.html">
          <span class="brand-mark">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect width="28" height="28" rx="8" fill="#2563EB"/>
              <path d="M9 11.5V9.8a5 5 0 0 1 10 0v1.7" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
              <rect x="6.5" y="11.5" width="15" height="10" rx="2.6" fill="#FFFFFF"/>
              <circle cx="11.5" cy="16.5" r="1.15" fill="#2563EB"/>
              <circle cx="16.5" cy="16.5" r="1.15" fill="#2563EB"/>
            </svg>
          </span>
          <span class="brand-name">CartNest</span>
        </a>
        <nav class="app-nav-links">
          <a href="/customer-home.html">Shop</a>
          <a href="/view-cart.html">Cart</a>
          <a href="/profile.html">Profile</a>
        </nav>
        <div class="app-nav-user">
          <span class="user-chip" id="welcomeText"></span>
          <button class="btn-ghost-on-dark" onclick="logout()">Log out</button>
        </div>
      </div>
    </header>

    <div class="success-wrapper">
      <div class="success-card">
        <div class="success-icon">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
          </svg>
        </div>
        
        <h2>Order Placed Successfully!</h2>
        <p class="subtitle" style="margin-top: 6px; color: #64748b;">
          Thank you for shopping with CartNest. We’ve received your order and are preparing it for delivery.
        </p>

        <div class="order-meta-box">
          <div class="order-meta-item">
            <span>Estimated Delivery</span>
            <strong id="deliveryDate">3–5 Business Days</strong>
          </div>
          <div class="order-meta-item" style="text-align: right;">
            <span>Payment Status</span>
            <strong style="color: #16a34a;">Paid (Razorpay)</strong>
          </div>
        </div>

        <div class="timeline">
          <div class="timeline-step completed">
            <div class="timeline-dot">✓</div>
            <div class="timeline-label">Confirmed</div>
          </div>
          <div class="timeline-step active">
            <div class="timeline-dot">2</div>
            <div class="timeline-label">Processing</div>
          </div>
          <div class="timeline-step">
            <div class="timeline-dot">3</div>
            <div class="timeline-label">Shipped</div>
          </div>
          <div class="timeline-step">
            <div class="timeline-dot">4</div>
            <div class="timeline-label">Delivered</div>
          </div>
        </div>

        <div class="action-buttons">
          <button class="btn-ghost" onclick="window.location.href='/customer-home.html'">Continue Shopping</button>
        </div>
      </div>
    </div>

    <!-- Script loading customer auth & navigation logic -->
    <script src="/js/customer.js"></script>
</body>
</html>
