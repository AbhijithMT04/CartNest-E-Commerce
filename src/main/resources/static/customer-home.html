<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — CartNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="shop-nav">
    <div class="shop-nav-inner">
      <a class="brand" href="/customer-home.html">
        <span class="brand-mark">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="28" height="28" rx="8" fill="#2563EB"/>
            <path d="M9 11.5V9.8a5 5 0 0 1 10 0v1.7" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
            <rect x="6.5" y="11.5" width="15" height="10" rx="2.6" fill="#FFFFFF"/>
            <circle cx="11.5" cy="16.5" r="1.15" fill="#2563EB"/>
            <circle cx="16.5" cy="16.5" r="1.15" fill="#2563EB"/>
          </svg>
        </span>
        <span class="brand-name">CartNest</span>
      </a>

      <div class="shop-search">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" stroke="#64748B" stroke-width="1.4"/>
          <path d="M10.5 10.5L14 14" stroke="#64748B" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search products..." oninput="applyFilters()" />
      </div>

      <div class="shop-nav-right">
        <button class="cart-btn" onclick="goToCart()" aria-label="View cart">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M6 7.5V6.3a3 3 0 0 1 6 0v1.2" stroke="#0F172A" stroke-width="1.4" stroke-linecap="round"/>
            <rect x="3.5" y="7.5" width="11" height="7.5" rx="1.8" stroke="#0F172A" stroke-width="1.4"/>
          </svg>
          <span class="cart-badge" id="cartBadge">0</span>
        </button>

        <a class="profile-chip" href="/profile.html">
          <span class="avatar-circle" id="avatarInitial">?</span>
          <span class="profile-chip-text">
            <span class="profile-chip-name" id="chipUsername"></span>
            <span class="profile-chip-role" id="chipRole">View profile</span>
          </span>
        </a>

        <button class="btn-ghost" onclick="logout()">Log out</button>
      </div>
    </div>

    <div class="category-pills" id="categoryPills"></div>
  </header>

  <div class="page">
    <div id="productList" class="product-grid"></div>
  </div>

  <script src="/js/customer.js"></script>
</body>
</html>
